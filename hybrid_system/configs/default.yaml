thresholds:
  eye_aspect_ratio: 0.22
  mouth_aspect_ratio: 0.50
  head_offset: 0.42
  ear_zscore_threshold: -2.0
  mar_zscore_threshold: 3.0
  ear_trigger_frames: 30
  pitch_trigger_frames: 15
  pitch_upper: 0.3
  pitch_lower: -0.2
  phone_confidence: 0.45
  phone_use_frames: 2
  phone_hold_frames: 12
  missing_face_frames: 8
  eye_closed_frames: 8
  drowsy_frames: 36
  yawn_frames: 6
  distracted_frames: 12
  classification_threshold: 6
  yaw_threshold: 0.25

vision:
  provider: auto
  face_landmarker_model: models/face_landmarker.task
  fallback_to_haar: true
  process_every_n_frames: 2
  draw_landmarks: true
  camera_index: 0
  process_width: 640
  process_height: 480

object_detector:
  enabled: true
  provider: onnx
  model_path: yolov8n.onnx
  confidence_threshold: 0.25
  iou_threshold: 0.45
  phone_labels:
    - cell phone
    - mobile phone
    - phone

calibration:
  frame_count: 100
  frames_start: 0
  min_ear: 0.15
  max_mar: 0.60
  max_abs_pitch: 1.25
  max_abs_yaw: 1.25
  max_abs_roll: 1.25
  stable_window_size: 10
  ear_std_max: 0.01
  mar_std_max: 0.02
  pose_std_max: 0.08

lstm:
  model_path: models/clf_lstm.pth
  input_sequence_length: 20
  classification_threshold: 3

head_pose:
  model_path: models/model.pkl
  axis_draw_size: 50

hardware:
  gpio_enabled: false
  led_calibration_pin: 2
  led_inference_pin: 3
  button_restart_pin: 14
  button_pause_pin: 15
  beep_frequency: 1850
  beep_duration: 0.45
  beep_interval: 1.75
  alert_hold_seconds: 2.5
  alert_stable_seconds: 1.2
  alsa_device: ""

runtime:
  output_fps: null
  max_frames: null
  display: true
  write_video: true
  alert_cooldown_seconds: 2.0

report:
  unsafe_threshold: 0.45
  timeline_stride_frames: 3

signal_weights:
  eyes_closed: 0.34
  drowsy: 0.54
  yawning: 0.22
  distracted: 0.34
  phone_use: 0.64
  face_lost: 0.25
